<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | SortyX Ventures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .success-banner { display: none; }
        /* Smooth fade-in for the banner */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide { animation: slideDown 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white shadow-2xl rounded-2xl overflow-hidden border border-slate-200 relative">
        
        <div id="successBanner" class="success-banner animate-slide bg-emerald-500 text-white p-4 text-center font-semibold">
            🚀 Application Submitted Successfully!
        </div>

        <header class="flex items-center p-8 border-b border-slate-100">
            <div class="w-12 h-12 mr-4 flex-shrink-0">
                <img src="/static/sortyx_logo-removebg-preview.png" alt="SortyX Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h2 class="text-slate-800 font-bold text-lg leading-tight">SortyX Ventures Private Limited</h2>
                <p class="text-slate-500 text-sm">Chennai, Tamil Nadu</p>
            </div>
        </header>

        <div class="p-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-8 text-center">Job Application Form</h1>

            <form id="applyForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">First Name *</label>
                        <input type="text" name="first_name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Last Name *</label>
                        <input type="text" name="last_name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Email *</label>
                        <input type="email" name="email" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Phone *</label>
                        <input type="tel" name="phone" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">College *</label>
                        <input type="text" name="college" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Year of Passing *</label>
                        <input type="number" name="yop" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Applied Role *</label>
                    <select name="role" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="">Choose a role...</option>
                        <option value="Python Developer">Python Developer</option>
                        <option value="AI-ML Engineer">AI-ML Engineer</option>
                        <option value="Data Analyst">Data Analyst</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Resume (PDF/DOCX) *</label>
                    <input type="file" name="file" accept=".pdf,.docx" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Notes (Optional)</label>
                    <textarea name="notes" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95 disabled:bg-slate-400">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script>
        // Add this to the TOP of your <script> in index.html
document.addEventListener('DOMContentLoaded', async () => {
    const roleSelect = document.querySelector('select[name="role"]');
    
    try {
        const response = await fetch('http://127.0.0.1:8000/get-active-roles');
        const roles = await response.json();
        
        // Clear existing placeholders and fill with live roles
        roleSelect.innerHTML = '<option value="">Choose a role...</option>';
        roles.forEach(roleTitle => {
            const opt = document.createElement('option');
            opt.value = roleTitle;
            opt.textContent = roleTitle;
            roleSelect.appendChild(opt);
        });
    } catch (err) {
        console.error("Failed to load live roles:", err);
    }
});
        const form = document.getElementById('applyForm');
        const submitBtn = document.getElementById('submitBtn');
        const successBanner = document.getElementById('successBanner');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            // 1. Loading State
            submitBtn.disabled = true;
            submitBtn.innerText = "Analyzing Resume...";

            const formData = new FormData(form);
            
            // 2. Combine First and Last Name for FastAPI
            const fullName = `${formData.get('first_name')} ${formData.get('last_name')}`;
            formData.append('name', fullName);

            try {
                // 🚨 Change this URL to your actual endpoint
                const response = await fetch('http://localhost:8000/apply', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // 3. Success State
                    successBanner.style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to see the message
                    form.reset();
                    
                    // Optional: Hide banner after 5 seconds
                    setTimeout(() => { successBanner.style.display = 'none'; }, 5000);
                } else {
                    alert("Submission failed. Check your data and try again.");
                }
            } catch (err) {
                alert("Connection Error. Is the backend server running?");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Application";
            }
        };
    </script>
</body>
</html>

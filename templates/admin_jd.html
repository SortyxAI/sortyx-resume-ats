<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | SortyX Job Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl border border-slate-200 overflow-hidden">
        
        <div id="publishSuccess" class="hidden bg-emerald-600 text-white p-4 text-center font-bold text-sm">
            🚀 JOB PUBLISHED SUCCESSFULLY
        </div>

        <div class="bg-slate-800 p-6 text-white flex justify-between items-center">
            <h1 class="text-xl font-bold">SortyX Admin: Job Management</h1>
            <a href="/" class="text-xs bg-slate-700 px-3 py-1 rounded hover:bg-slate-600 transition-colors">← Back to Site</a>
        </div>

        <form id="jdForm" class="p-8 space-y-6">
            <input type="hidden" name="job_id" id="jobId">
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Job Title</label>
                <input type="text" name="title" id="jobTitle" required placeholder="e.g. Senior Python Developer"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Detailed Job Description</label>
                <textarea name="description" id="jobDesc" required rows="8" placeholder="Paste requirements here..."
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none resize-none transition-all"></textarea>
            </div>

            <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
                <label class="block text-sm font-bold text-slate-700 mb-2">Minimum ATS Score Threshold</label>
                <input type="range" name="min_score" id="scoreRange" min="0" max="100" value="70" 
                    class="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer">
                <div class="text-center font-bold text-indigo-600 mt-2" id="scoreValue">70%</div>
            </div>

            <button type="submit" id="saveBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-100 transition-all active:scale-95 disabled:bg-slate-400">
                Save & Publish Job Role
            </button>
        </form>

        <div class="p-8 border-t border-slate-100 bg-slate-50">
            <h3 class="font-bold text-slate-700 mb-4 flex items-center">
                <span class="mr-2">📁</span> Active Roles (Click to Edit)
            </h3>
            <div id="jobList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('jdForm');
        const saveBtn = document.getElementById('saveBtn');
        const successBanner = document.getElementById('publishSuccess');
        const scoreRange = document.getElementById('scoreRange');
        const scoreValue = document.getElementById('scoreValue');

        // Update threshold display
        scoreRange.oninput = () => scoreValue.innerText = `${scoreRange.value}%`;

        // Handle Form Submission
        form.onsubmit = async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    const successBanner = document.getElementById('publishSuccess');
    
    saveBtn.disabled = true;
    saveBtn.innerText = "Syncing...";

    const formData = new FormData(form);
    
    // 🚀 CRITICAL: Convert the payload to the right format
    const payload = {
        title: formData.get('title'),
        description: formData.get('description'),
        min_score: parseInt(formData.get('min_score')) // Force it to be a number
    };

    console.log("Sending Payload:", payload); // Debugging: Check your console!

    try {
        const response = await fetch('/admin/create-job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            console.log("✅ Success response received");
            successBanner.classList.remove('hidden'); // Show the banner
            form.reset();
            document.getElementById('scoreValue').innerText = "70%";
            
            // Refresh the job list below
            if (typeof loadJobs === 'function') loadJobs(); 
            
            setTimeout(() => successBanner.classList.add('hidden'), 5000);
        } else {
            const errorData = await response.json();
            console.error("Server Error:", errorData);
            alert("Error: " + JSON.stringify(errorData.detail));
        }
    } catch (err) {
        console.error("Fetch Error:", err);
        alert("Could not connect to the server.");
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save & Publish Job Role";
    }
};
        // Function to load jobs (You'll need an endpoint for this)
        async function loadJobs() {
            const listDiv = document.getElementById('jobList');
            try {
                const res = await fetch('/get-active-roles');
                const roles = await res.json();
                listDiv.innerHTML = roles.map(role => `
                    <div class="p-3 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-indigo-500 hover:shadow-sm transition-all text-sm font-medium text-slate-600">
                        ${role}
                    </div>
                `).join('');
            } catch (e) { console.log("List load failed"); }
        }

        window.onload = loadJobs;
    </script>
</body>
</html>
